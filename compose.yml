# Local development services. Start with: podman compose up -d
services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: cs_odds
      POSTGRES_PASSWORD: cs_odds
      POSTGRES_DB: cs_odds
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs_odds -d cs_odds"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for attachments (RustFS, an open-source MinIO
  # replacement; MinIO no longer publishes community images).
  # S3 API: http://localhost:9000 · Console: http://localhost:9001
  s3:
    image: docker.io/rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: csodds
      RUSTFS_SECRET_KEY: csodds-dev-secret
      RUSTFS_CONSOLE_ENABLE: "true"
      # Browsers upload straight to storage with presigned URLs.
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3data:/data

  # Catches outgoing email (milestone 5). Web UI: http://localhost:8025
  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  s3data:
