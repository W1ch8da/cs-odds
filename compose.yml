# Local development services. Start with: podman compose up -d
services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: cs_odds
      POSTGRES_PASSWORD: cs_odds
      POSTGRES_DB: cs_odds
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs_odds -d cs_odds"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for attachments (milestone 4). Console: http://localhost:9001
  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Catches outgoing email (milestone 5). Web UI: http://localhost:8025
  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  miniodata:
