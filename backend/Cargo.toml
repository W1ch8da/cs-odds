[package]
name = "cs_odds_backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

# Hexagonal (Ports & Adapters) layout, see src/lib.rs.
# Only adapters/ may use axum, tower-http or sqlx.
[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
aws-sdk-s3 = "1.150.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "pool", "hostname", "builder", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["derive", "runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tower = { version = "0.5.3", features = ["util"] }
